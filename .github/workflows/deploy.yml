name: Deploy Backend

on:
  push:
    branches: [main]
    paths-ignore:
      - "apps/web/**"
      - "vercel.json"
      - "docs/**"
      - "**.md"

jobs:
  typecheck-build:
    name: Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate
        env:
          DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Run tests
        run: pnpm turbo test

      - name: Typecheck all packages
        run: pnpm turbo typecheck

      - name: Build all packages
        run: pnpm turbo build

  docker:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: typecheck-build

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push gateway
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/gateway/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/${{ github.repository }}/gateway:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push workers
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/workers/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/${{ github.repository }}/workers:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Oracle Cloud
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ubuntu
          key: ${{ secrets.ORACLE_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_ACTOR,ADMIN_API_KEY
          command_timeout: 5m
          script: |
            set -e
            export PATH=$PATH:/usr/local/bin:/usr/local/sbin
            cd ~/edge-language-coach
            git fetch origin main
            git reset --hard origin/main
            grep -q "^ADMIN_API_KEY=" .env \
              && sed -i "s/^ADMIN_API_KEY=.*/ADMIN_API_KEY=$ADMIN_API_KEY/" .env \
              || echo "ADMIN_API_KEY=$ADMIN_API_KEY" >> .env
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker compose -f docker-compose.prod.yml restart nginx-lb
            docker image prune -f
